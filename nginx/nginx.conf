# Reverse proxy / load balancer in front of the calculator replicas.
# Runs as non-root (nginx-unprivileged image), so it listens on 8080 inside the container.

# Docker's embedded DNS. Re-resolving "calculator" every 10s means nginx picks up
# new container IPs automatically after a redeploy (no stale upstreams / 502s).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream calculator_backend {
    zone calculator_backend 64k;          # shared memory needed for runtime re-resolution
    server calculator:8080 resolve;       # every replica of the "calculator" service (round-robin)
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    # Add which replica served the request - handy to demonstrate load balancing.
    add_header X-Upstream-Server $upstream_addr always;

    # Liveness of the proxy itself (used by its own Docker health check).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        proxy_pass         http://calculator_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    15s;
        # If one replica is restarting, transparently retry on the other one.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
