spring.application.name=calculator

# Port can be overridden with the SERVER_PORT environment variable (Spring relaxed binding).
server.port=${SERVER_PORT:8080}

# Graceful shutdown lets in-flight requests finish when Docker stops the container.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Actuator ---------------------------------------------------------------
# Only expose what we need; /actuator/health is used by the Docker / Compose health checks.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Calculator REST API
info.app.version=@project.version@
info.app.environment=${APP_ENV:local}
