# Jenkins CI/CD server (runs separately from the application stack).
#
#   cd jenkins
#   ./setup-secrets.ps1                 # one-time: writes .env + secrets/ (both git-ignored)
#   docker compose up -d --build        # Jenkins on http://localhost:8080
#   docker compose --profile webhook up -d   # also start the public tunnel for the GitHub webhook
name: jenkins

services:
  jenkins:
    image: calculator-jenkins:latest
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL:?set GITHUB_REPO_URL in jenkins/.env}
      DOCKERHUB_USERNAME: ${DOCKERHUB_USERNAME:?set DOCKERHUB_USERNAME in jenkins/.env}
      SMTP_USERNAME: ${SMTP_USERNAME:?set SMTP_USERNAME in jenkins/.env}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-${SMTP_USERNAME}}
    secrets:                       # mounted read-only at /run/secrets/<name>, read by JCasC
      - jenkins_admin_password
      - dockerhub_token
      - smtp_app_password
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_conf/casc.yaml:ro
      # Lets the pipeline run `docker build/push/compose` against the host's Docker engine.
      - /var/run/docker.sock:/var/run/docker.sock
    # The Docker socket is owned by root:root (mode 660) on Docker Desktop, so the
    # jenkins user is added to group 0 to be allowed to use it.
    group_add:
      - "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Optional: public HTTPS URL for the GitHub webhook (no account needed).
  # Run update-webhook.ps1 after starting it to point the GitHub webhook at the new URL.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["webhook"]
    container_name: jenkins-tunnel
    command: tunnel --no-autoupdate --url http://jenkins:8080
    restart: unless-stopped
    depends_on:
      - jenkins

volumes:
  jenkins_home:

secrets:
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password
  dockerhub_token:
    file: ./secrets/dockerhub_token
  smtp_app_password:
    file: ./secrets/smtp_app_password
